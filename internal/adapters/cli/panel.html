<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V720 camera</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f1115; color: #e6e8ec;
    display: flex; flex-direction: column; min-height: 100%;
  }
  header { padding: .6rem 1rem; font-weight: 600; letter-spacing: .02em; border-bottom: 1px solid #262a33; }
  header small { color: #8b93a1; font-weight: 400; margin-left: .5rem; }
  main { flex: 1; display: grid; place-items: center; padding: 1rem; min-height: 0; }
  #view { max-width: 100%; max-height: 70vh; border-radius: 8px; background: #000; object-fit: contain; }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; padding: 1rem; border-top: 1px solid #262a33; }
  .group { display: flex; align-items: center; gap: .35rem; background: #171a21; border: 1px solid #262a33; border-radius: 10px; padding: .35rem .5rem; }
  .group span { color: #8b93a1; font-size: .8rem; padding: 0 .25rem; }
  button {
    font: inherit; color: #e6e8ec; background: #232833; border: 1px solid #333a47;
    border-radius: 8px; padding: .45rem .8rem; cursor: pointer; transition: background .12s, border-color .12s;
  }
  button:hover { background: #2b3140; }
  button:active { transform: translateY(1px); }
  button.on { background: #2f6df6; border-color: #2f6df6; color: #fff; }
  button.rec { background: #b4322e; border-color: #b4322e; color: #fff; }
  button.rec::before { content: "● "; }
  #toast {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    background: #232833; border: 1px solid #333a47; border-radius: 8px;
    padding: .5rem .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: .9rem;
  }
  #toast.show { opacity: 1; }
  #toast.err { border-color: #b4322e; }
</style>

<header>V720 camera <small id="status">live control panel</small></header>

<main>
  <!-- The MJPEG stream renders straight into an <img>, like any IP camera. -->
  <img id="view" src="/stream.mjpg" alt="live camera view">
</main>

<div class="controls">
  <div class="group">
    <span>Quality</span>
    <button data-set="quality" data-value="2">HD</button>
    <button data-set="quality" data-value="1">SD</button>
  </div>
  <div class="group">
    <span>IR night</span>
    <button data-set="ir" data-value="1">On</button>
    <button data-set="ir" data-value="0">Off</button>
  </div>
  <div class="group">
    <span>White LED</span>
    <button data-set="white-led" data-value="1">On</button>
    <button data-set="white-led" data-value="0">Off</button>
  </div>
  <div class="group">
    <span>Motion alert</span>
    <button data-set="motion-alert" data-value="1">On</button>
    <button data-set="motion-alert" data-value="0">Off</button>
  </div>
  <div class="group">
    <button id="switchcam" data-set="camera" data-value="1">Switch camera</button>
    <button id="snap">Snapshot</button>
    <button id="record">Record</button>
  </div>
</div>

<div id="toast"></div>

<script>
  const toast = document.getElementById("toast");
  let toastTimer;
  function flash(msg, isErr) {
    toast.textContent = msg;
    toast.classList.toggle("err", !!isErr);
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
  }

  async function control(set, value) {
    try {
      const res = await fetch("/control", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "set=" + encodeURIComponent(set) + "&value=" + encodeURIComponent(value),
      });
      if (!res.ok) { flash(set + ": " + (await res.text()).trim(), true); return false; }
      flash(set + " → " + value);
      return true;
    } catch (e) {
      flash(set + ": " + e.message, true);
      return false;
    }
  }

  // Wire every button that carries a data-set/data-value pair. Within a group,
  // mark the clicked button active so the current choice is visible.
  document.querySelectorAll("button[data-set]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!(await control(btn.dataset.set, btn.dataset.value))) return;
      const group = btn.closest(".group");
      if (group) group.querySelectorAll("button[data-set='" + btn.dataset.set + "']")
        .forEach(b => b.classList.toggle("on", b === btn));
      // Let the camera report the new setting, then reconcile the highlights.
      setTimeout(refreshState, 600);
    });
  });

  // Reflect the camera's actual reported state: highlight the button matching
  // each setting, and show battery / Wi-Fi / firmware in the header.
  const stateKey = { quality: "speedGrade", ir: "IrLed", "motion-alert": "moveAlert", "white-led": "ledEI" };
  async function refreshState() {
    let s;
    try { s = await fetch("/state").then(r => r.json()); } catch (e) { return; }
    for (const [set, key] of Object.entries(stateKey)) {
      if (s[key] === undefined) continue;
      document.querySelectorAll("button[data-set='" + set + "']")
        .forEach(b => b.classList.toggle("on", Number(b.dataset.value) === s[key]));
    }
    const bits = [];
    if (s.devPower !== undefined) bits.push("🔋 " + s.devPower + "%");
    if (s.wifiName) bits.push(s.wifiName);
    if (s.version) bits.push("fw " + s.version);
    document.getElementById("status").textContent = bits.length ? bits.join("  ·  ") : "live control panel";
  }
  refreshState();
  setInterval(refreshState, 5000);

  // Switch camera toggles between lens 0 and 1.
  const sw = document.getElementById("switchcam");
  let cam = 1;
  sw.addEventListener("click", () => { cam ^= 1; sw.dataset.value = cam; });

  // Snapshot downloads the current frame.
  document.getElementById("snap").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = "/snapshot.jpg?t=" + Date.now();
    a.download = "snapshot-" + Date.now() + ".jpg";
    document.body.appendChild(a); a.click(); a.remove();
    flash("snapshot saved");
  });

  // Record toggles server-side capture to an MP4 (video + audio).
  const recBtn = document.getElementById("record");
  let recording = false;
  async function record(action) {
    const res = await fetch("/record?action=" + action, { method: "POST" });
    if (!res.ok) { flash("record: " + (await res.text()).trim(), true); return null; }
    return res.json();
  }
  recBtn.addEventListener("click", async () => {
    recBtn.disabled = true;
    try {
      if (!recording) {
        const r = await record("start");
        if (!r) return;
        recording = true;
        recBtn.textContent = "Stop"; recBtn.classList.add("rec");
        flash("recording → " + r.file);
      } else {
        flash("saving…");
        const r = await record("stop");
        recording = false;
        recBtn.textContent = "Record"; recBtn.classList.remove("rec");
        if (r) flash("saved " + r.file + " (" + r.frames + " frames, " + r.seconds + "s)");
      }
    } finally {
      recBtn.disabled = false;
    }
  });

  // Reflect an already-running recording (e.g. after a page refresh).
  fetch("/record").then(r => r.json()).then(s => {
    if (s.recording) { recording = true; recBtn.textContent = "Stop"; recBtn.classList.add("rec"); }
  }).catch(() => {});

  // If the stream stalls (camera hiccup), nudge the <img> to reconnect.
  const view = document.getElementById("view");
  view.addEventListener("error", () => {
    setTimeout(() => { view.src = "/stream.mjpg?t=" + Date.now(); }, 1000);
  });
</script>
